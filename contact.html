<!DOCTYPE html>
<html lang="zh-Hant">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>聯絡我們 | 日本旅遊推薦</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
            integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
            crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link rel="stylesheet" href="./styles/contact.css">
        <link rel="icon" href="./images/網站Logo.svg">
    </head>

    <body>
        <header>
            <a href="index.html" class="logo">
                <img src="./images/網站Logo.svg" alt="日本旅遊網Logo" />
                <h1><span class="year"></span>日本旅遊推薦</h1>
            </a>
            <nav>
                <ul>
                    <li><a href="index.html"><i class="fa-solid fa-plane"></i> 日本旅遊</a></li>
                    <li><a href="member-login.html"><i class="fa-solid fa-right-to-bracket"></i> 會員登入</a></li>
                    <li><a href="reservation.html"><i class="fa-solid fa-book"></i> 預約行程</a></li>
                    <li><a href="contact.html" class="active"><i class="fa-regular fa-address-book"></i> 聯絡我們</a></li>
                    <li><a href="about.html"><i class="fa-solid fa-circle-info"></i> 關於我們</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <section class="contact-section">
                <form class="form-container">
                    <h3 class="form-title">聯絡我們</h3>
                    <p class="form-instructions">請填寫下列表單與我們聯絡。<br>請勿輸入任何敏感或個人隱私資訊。</p>
                    <div class="form-group">
                        <label for="name" class="form-label">姓名</label>
                        <input type="text" id="name" name="name" required class="form-input">
                    </div>
                    <div class="form-group">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" name="email" required class="form-input">
                    </div>
                    <div class="form-group">
                        <label for="message" class="form-label">訊息</label>
                        <textarea id="message" name="message" rows="5" required class="form-textarea"></textarea>
                    </div>
                    <button type="submit" class="form-submit">送出訊息</button>
                </form>
            </section>
        </main>
        <footer>
            <section class="logo">
                <img src="./images/網站Logo.svg" alt="日本旅遊網Logo" />
                <h3><span class="year"></span>日本旅遊推薦</h3>
            </section>
            <section class="links" id="contact">
                <a href="https://www.facebook.com/"><img title="Facebook 粉絲頁" src=" ./Icons/facebook.svg"
                        alt="facebook logo" /></a>
                <a href="https://www.instagram.com/"><img title="Instagram 頁面" src="./Icons/instagram.svg"
                        alt="instagram logo" /></a>
                <a href="https://x.com/"><img title="Twitter (X) 頁面" src=" ./Icons/twitter.svg"
                        alt="twitter logo" /></a>
                <a href="https://www.youtube.com/"><img title="YouTube 頻道" src=" ./Icons/youtube.svg"
                        alt="youtube logo" /></a>
            </section>
        </footer>
        <script src="./script.js" defer></script>
    </body>

</html>
