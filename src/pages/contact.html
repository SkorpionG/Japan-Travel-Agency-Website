<!doctype html>
<html lang="zh-Hant">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
            integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <link rel="stylesheet" href="../style/contact.css" />
        <script src="../../src/components/site-header.js"></script>
        <script src="../../src/components/site-footer.js"></script>

        <script src="../../src/components/site-metadata.js"></script>
        <site-metadata
            title="聯絡我們 | 日本旅遊推薦"
            description="有任何日本旅遊規劃問題？歡迎填寫聯絡表單或透過電話、電子郵件與我們的專業旅遊顧問聯繫，我們將儘快為您服務。"
            keywords="聯絡我們, 旅遊諮詢, 客服支援, 聯絡表單, 日本旅遊問題"
            url="https://skorpiong.github.io/Japan-Travel-Agency-Website/src/pages/contact.html"
            root="../../"
        ></site-metadata>
    </head>

    <body>
        <site-header active="contact" root="../../"></site-header>
        <main>
            <section class="contact-section">
                <form class="form-container">
                    <h3 class="form-title">聯絡我們</h3>
                    <p class="form-instructions">
                        請填寫下列表單與我們聯絡。<br />請勿輸入任何敏感或個人隱私資訊。
                    </p>
                    <div class="form-group">
                        <label for="name" class="form-label">姓名</label>
                        <input type="text" id="name" name="name" required class="form-input" />
                    </div>
                    <div class="form-group">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" name="email" required class="form-input" />
                    </div>
                    <div class="form-group">
                        <label for="message" class="form-label">訊息</label>
                        <textarea
                            id="message"
                            name="message"
                            rows="5"
                            required
                            class="form-textarea"
                        ></textarea>
                    </div>
                    <button type="submit" class="form-submit">送出訊息</button>
                </form>
            </section>
        </main>
        <site-footer root="../../"></site-footer>
        <script src="../script.js" defer></script>
    </body>
</html>
